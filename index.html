<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <h3 id="topic"></h3>
  <label for="draft" style="display: none;">Проектный текст ответа:</label>
  <p id="draft" style="font-weight: bold;"></p>
  <label for="instructions" style="display: none;">Инструкции:</label>
  <p id="instructions" style="font-style: italic;"></p>
  <p id="error" style="color: tomato;"></p>
  <script type="module">
    const form = document.querySelector("form");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const instructions = document.querySelector("#instructions");
    const error = document.querySelector("#error");
    
    const cleanFields = () => {
      topic.textContent = "";
      draft.textContent = "";
      document.querySelector('label[for="draft"]').style.display = 'none';
      instructions.textContent = "";
      document.querySelector('label[for="instructions"]').style.display = 'none';
      error.textContent = "";
    };
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      cleanFields();
      const reply = await fetch("/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: document.querySelector("#message").value }),
      });
      const result = await reply.json();
      console.log(result);
      switch (result.status) {
        case "manual_review":
          instructions.textContent = 'Запрос должен быть рассмотрен менеджером вручную.';
          document.querySelector('label[for="instructions"]').style.display = 'block';  
          break;
        case "invalid_input":
          error.textContent = 'Некорректный ввод. Пожалуйста, проверьте ваш запрос.';
          break;
        default:
          topic.textContent = result.topic.slice(0, 1).toUpperCase() + result.topic.slice(1);
          draft.textContent = result.draft;
          document.querySelector('label[for="draft"]').style.display = 'block';
      }
    });
  </script>
</body>
</html>
